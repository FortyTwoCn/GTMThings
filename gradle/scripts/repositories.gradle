repositories {
    mavenCentral()
    maven {
        name = 'GTCEu'
        url = 'https://maven.gtceu.com'
        content { includeGroup 'com.gregtechceu.gtceu'; includeGroup 'brachy.modularui' }
    }
    maven {
        name = 'Registrate'
        url = 'https://mvn.devos.one/snapshots/'
        content { includeGroup 'com.tterrag.registrate' }
    }
    maven {
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public'
        content { includeGroup 'dev.toma.configuration' }
    }
    maven {
        name = 'AppliedEnergistics'
        url = 'https://modmaven.dev'
        content { includeGroup 'org.appliedenergistics' }
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'EMI'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases/'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content { includeGroup 'dev.architectury' }
    }
}
