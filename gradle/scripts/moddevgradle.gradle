neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    addModdingDependenciesTo(sourceSets.gameTest)

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
//            programArguments.addAll('--width', '3200')
//            programArguments.addAll('--height', '1800')
        }

        server {
            server()
            gameDirectory.set(file('run/server'))
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory.set(file('run/gametest'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        smokeClient {
            client()
            sourceSet = sourceSets.gameTest
            jvmArgument '-Xmx4G'
            programArguments.addAll('--username', 'PortTester', '--quickPlaySingleplayer', 'port-smoke', '--width', '1280', '--height', '800')
            systemProperty 'gtmthings.portSmoke', 'true'
        }

        data {
            data()
            ideName = "Data"
            gameDirectory.set(file('run/data'))
            programArguments.addAll('--mod', project.mod_id)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())
        }

        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
}
