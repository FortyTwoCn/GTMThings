dependencies {
    compileOnly libs.jetbrains.annotations
    implementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation("dev.toma.configuration:configuration-${minecraft_version}:${configuration_version}")
    implementation("brachy.modularui:modularui-mc1.21.1:${modularui_version}") {
        version { strictly modularui_version }
    }

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}") { transitive = false }
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") { transitive = false }
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    implementation("dev.emi:emi-neoforge:${emi_version}")
    implementation("maven.modrinth:jade:${jade_version}")
    implementation("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
}

// Opt-in runtime for verifying that team-based energy remains compatible with FTB Teams.
if (project.hasProperty('testFtbIntegration')) {
    dependencies {
        runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}") { transitive = false }
        runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
        runtimeOnly("dev.architectury:architectury-neoforge:13.0.8") { transitive = false }
    }
}
